<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weather Mixtape</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #fbeaf0;
    --paper-dark: #f5d6e2;
    --ink: #4a2436;
    --line: #e3a8c0;
    --accent: #c23b74;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: #fff5f8;
  }

  body {
    font-family: 'Cormorant Garamond', serif;
    color: var(--ink);
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 40px 16px;
    min-height: 100vh;
  }

  .card {
    width: 100%;
    max-width: 460px;
    background: var(--paper);
    background-image:
      radial-gradient(circle at 12% 8%, rgba(0,0,0,0.035) 0, transparent 45%),
      radial-gradient(circle at 85% 92%, rgba(0,0,0,0.035) 0, transparent 45%);
    border: 1px solid var(--line);
    box-shadow: 0 1px 0 rgba(0,0,0,0.05), 0 12px 24px -12px rgba(74,36,54,0.35);
    padding: 22px 24px 26px;
    position: relative;
  }

  .card::before {
    content: '';
    position: absolute;
    top: 8px; left: 8px; right: 8px; bottom: 8px;
    border: 1px solid var(--line);
    pointer-events: none;
    opacity: 0.6;
  }

  .cardhead {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-family: 'Courier Prime', monospace;
    font-size: 11px;
    letter-spacing: 0.03em;
    color: #8a4f68;
    margin-bottom: 4px;
  }

  h1 {
    font-weight: 600;
    font-size: 28px;
    margin: 2px 0 18px;
    letter-spacing: 0.01em;
  }

  .search-row {
    display: flex;
    gap: 8px;
    margin-bottom: 18px;
  }

  input[type="text"] {
    flex: 1;
    font-family: 'Cormorant Garamond', serif;
    font-size: 17px;
    background: var(--paper-dark);
    border: 1px solid var(--line);
    padding: 9px 12px;
    color: var(--ink);
    outline: none;
  }

  input[type="text"]:focus { border-color: var(--accent); }

  button {
    font-family: 'Courier Prime', monospace;
    font-size: 12px;
    background: var(--ink);
    color: var(--paper);
    border: none;
    padding: 0 16px;
    cursor: pointer;
    letter-spacing: 0.02em;
  }

  button:hover { background: var(--accent); }
  button:disabled { opacity: 0.5; cursor: default; }

  .divider {
    border: none;
    border-top: 1px dashed var(--line);
    margin: 16px 0;
  }

  .weatherline {
    font-family: 'Courier Prime', monospace;
    font-size: 12px;
    color: var(--accent);
    letter-spacing: 0.02em;
    margin-bottom: 16px;
    min-height: 14px;
  }

  .passage {
    font-size: 21px;
    line-height: 1.5;
    font-style: italic;
    min-height: 90px;
    display: flex;
    align-items: center;
  }

  .passage.placeholder {
    color: #a5688a;
    font-size: 17px;
    font-style: normal;
  }

  .attribution {
    margin-top: 14px;
    font-family: 'Courier Prime', monospace;
    font-size: 11.5px;
    color: #8a4f68;
    text-align: right;
  }

  .attribution .title { font-style: italic; }

  .booklink {
    display: block;
    margin-top: 6px;
    font-family: 'Courier Prime', monospace;
    font-size: 11.5px;
    text-align: right;
    color: var(--accent);
    text-decoration: none;
  }

  .booklink:hover { text-decoration: underline; }

  .footer-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 20px;
  }

  .draw-again {
    background: transparent;
    color: var(--ink);
    border: 1px solid var(--ink);
    padding: 7px 14px;
  }

  .draw-again:hover { background: var(--ink); color: var(--paper); }

  .stamp {
    font-family: 'Courier Prime', monospace;
    font-size: 10px;
    color: #c98aa8;
    border: 1px solid #c98aa8;
    padding: 3px 7px;
    transform: rotate(-3deg);
    letter-spacing: 0.04em;
  }

  .error {
    font-family: 'Courier Prime', monospace;
    font-size: 12px;
    color: var(--accent);
    margin-bottom: 12px;
    min-height: 14px;
  }
</style>
</head>
<body>

<div class="card" id="card">
  <div class="cardhead">
    <span>WEATHER MIXTAPE</span>
    <span id="cardnum">No. 001</span>
  </div>
  <h1>Today's reading, by the weather</h1>

  <div class="search-row">
    <input type="text" id="cityInput" placeholder="Try “Kyoto” or “Reykjavik”" />
    <button id="goBtn">Get mixtape</button>
  </div>

  <div class="error" id="errorMsg"></div>

  <hr class="divider">

  <div class="weatherline" id="weatherLine"></div>

  <div class="passage placeholder" id="passage">
    Type a place above — real weather, matched live to a line pulled from a real Gutenberg book.
  </div>

  <div class="attribution" id="attribution"></div>
  <a class="booklink" id="bookLink" href="#" target="_blank" rel="noopener" style="display:none;">read the full book →</a>

  <div class="footer-row">
    <button class="draw-again" id="drawAgain" style="display:none;">draw another card</button>
    <span class="stamp">PUBLIC DOMAIN · EX LIBRIS</span>
  </div>
</div>

<script>
const WEATHER_ICON = { clear: "☀", cloudy: "☁", foggy: "▒", rainy: "☂", snowy: "❄", stormy: "⚡", windy: "≋" };

function moodFromCode(code, windSpeed) {
  if (windSpeed >= 35) return "windy";
  if (code === 0) return "clear";
  if (code === 1 || code === 2 || code === 3) return "cloudy";
  if (code === 45 || code === 48) return "foggy";
  if ((code >= 51 && code <= 67) || (code >= 80 && code <= 82)) return "rainy";
  if (code >= 71 && code <= 77) return "snowy";
  if (code >= 95) return "stormy";
  return "cloudy";
}

let cardCount = 0;
let currentMood = null;

function pad(n) { return String(n).padStart(3, "0"); }

async function getWeather(city) {
  const geoRes = await fetch("https://geocoding-api.open-meteo.com/v1/search?name=" + encodeURIComponent(city) + "&count=1&language=en&format=json");
  const geo = await geoRes.json();
  if (!geo.results || geo.results.length === 0) {
    throw new Error("Couldn't find that place — try a bigger nearby city.");
  }
  const { latitude, longitude, name, country } = geo.results[0];
  const wRes = await fetch("https://api.open-meteo.com/v1/forecast?latitude=" + latitude + "&longitude=" + longitude + "&current=temperature_2m,weather_code,wind_speed_10m");
  const w = await wRes.json();
  return {
    place: name + (country ? ", " + country : ""),
    temp: Math.round(w.current.temperature_2m),
    code: w.current.weather_code,
    wind: w.current.wind_speed_10m
  };
}

async function getPassage(mood) {
  const res = await fetch("/api/passage?mood=" + encodeURIComponent(mood));
  if (!res.ok) throw new Error("Couldn't find a matching passage — try again.");
  return res.json();
}

async function run() {
  const city = document.getElementById("cityInput").value.trim();
  const errorEl = document.getElementById("errorMsg");
  const weatherLine = document.getElementById("weatherLine");
  const goBtn = document.getElementById("goBtn");
  const passageEl = document.getElementById("passage");
  const attrEl = document.getElementById("attribution");
  const bookLink = document.getElementById("bookLink");
  errorEl.textContent = "";

  if (!city) {
    errorEl.textContent = "Type a place first.";
    return;
  }

  goBtn.disabled = true;
  goBtn.textContent = "…";
  weatherLine.textContent = "checking the sky…";
  passageEl.textContent = "flipping through the stacks…";
  passageEl.classList.add("placeholder");
  bookLink.style.display = "none";

  try {
    const data = await getWeather(city);
    const mood = moodFromCode(data.code, data.wind);
    currentMood = mood;
    weatherLine.textContent = WEATHER_ICON[mood] + "  " + mood.toUpperCase() + " · " + data.temp + "°C · " + data.place;

    const p = await getPassage(mood);
    passageEl.classList.remove("placeholder");
    passageEl.textContent = "“" + p.text + "”";
    attrEl.innerHTML = "— " + p.author + ", <span class='title'>" + p.title + "</span>";
    bookLink.href = p.link;
    bookLink.style.display = "block";
    cardCount++;
    document.getElementById("cardnum").textContent = "No. " + pad(cardCount);
    document.getElementById("drawAgain").style.display = "inline-block";
  } catch (e) {
    errorEl.textContent = e.message || "Something went wrong.";
    weatherLine.textContent = "";
    passageEl.textContent = "Type a place above to try again.";
  } finally {
    goBtn.disabled = false;
    goBtn.textContent = "Get mixtape";
  }
}

async function drawAgain() {
  if (!currentMood) return;
  const passageEl = document.getElementById("passage");
  const attrEl = document.getElementById("attribution");
  const bookLink = document.getElementById("bookLink");
  const errorEl = document.getElementById("errorMsg");
  errorEl.textContent = "";
  passageEl.textContent = "flipping through the stacks…";
  try {
    const p = await getPassage(currentMood);
    passageEl.classList.remove("placeholder");
    passageEl.textContent = "“" + p.text + "”";
    attrEl.innerHTML = "— " + p.author + ", <span class='title'>" + p.title + "</span>";
    bookLink.href = p.link;
    bookLink.style.display = "block";
    cardCount++;
    document.getElementById("cardnum").textContent = "No. " + pad(cardCount);
  } catch (e) {
    errorEl.textContent = e.message || "Something went wrong.";
  }
}

document.getElementById("goBtn").addEventListener("click", run);
document.getElementById("cityInput").addEventListener("keydown", (e) => {
  if (e.key === "Enter") run();
});
document.getElementById("drawAgain").addEventListener("click", drawAgain);
</script>

</body>
</html>
